[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recsys-lab"
version = "0.1.0"
description = "Recommender Systems Lab: popularity, content-based and collaborative-filtering recommenders evaluated on the authentic MovieLens 100K dataset."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["recommender-systems", "movielens", "collaborative-filtering", "ndcg", "streamlit"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
authors = [{ name = "Recommender Systems Lab" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "streamlit>=1.40",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/recsys_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
